name: validate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  MINT_VERSION: 4.3.67

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `paths:` filter: this job is a required status check, and a required
      # check that is skipped never reports, leaving every filtered PR pending.
      - name: Validate Mintlify build
        run: npx --yes "mint@$MINT_VERSION" validate

      - name: No new navigation findings
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check_new_findings.py --base "$BASE_SHA" navigation

      - name: No new broken links
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check_new_findings.py --base "$BASE_SHA" broken-links
