<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" width="640" height="372" role="img" aria-labelledby="t d">
  <title id="t">How a membership tier reaches Extole</title>
  <desc id="d">Your systems decide when a participant changes tier. The tier reaches Extole by one of two paths: written onto the person's profile as a loyalty_tier attribute sent with an event, or synced as audience membership over the API. Extole then reads the tier in reward rules, trigger rules and targeting. Choose one path, not both.</desc>
  <style>
    .n  { fill:none; stroke:#78716C; stroke-width:1.25; rx:5 }
    .na { fill:none; stroke:#EE0049; stroke-width:1.6; rx:5 }
    .t  { font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; fill:#78716C }
    .ta { font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; fill:#EE0049 }
    .s  { font:400 11.5px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; fill:#78716C; opacity:.85 }
    .m  { font:400 11.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:#78716C; opacity:.95 }
    .pick { font:500 11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; fill:#EE0049; letter-spacing:.06em; text-anchor:middle }
    .eyebrow { font:500 10px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; fill:#78716C; letter-spacing:.14em }
    .ln { stroke:#78716C; stroke-width:1.25; fill:none }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#78716C"/>
    </marker>
  </defs>

  <rect class="n" x="170" y="26" width="300" height="58"/>
  <text class="t" x="190" y="50">Your systems</text>
  <text class="s" x="190" y="69">you decide when a participant changes tier</text>

  <line class="ln" x1="300" y1="84" x2="185" y2="134" marker-end="url(#a)"/>
  <line class="ln" x1="340" y1="84" x2="455" y2="134" marker-end="url(#a)"/>

  <rect class="n" x="40" y="138" width="260" height="80"/>
  <text class="t" x="58" y="163">Profile attribute</text>
  <text class="m" x="58" y="184">me.public.loyalty_tier</text>
  <text class="s" x="58" y="203">sent with an event</text>

  <rect class="n" x="340" y="138" width="260" height="80"/>
  <text class="t" x="358" y="163">Audience membership</text>
  <text class="s" x="358" y="184">one audience per tier,</text>
  <text class="s" x="358" y="203">synced over the API</text>

  <text class="pick" x="320" y="182">OR</text>

  <line class="ln" x1="185" y1="218" x2="262" y2="252" marker-end="url(#a)"/>
  <line class="ln" x1="455" y1="218" x2="378" y2="252" marker-end="url(#a)"/>

  <rect class="na" x="170" y="256" width="300" height="62"/>
  <text class="ta" x="190" y="281">Extole reads the tier</text>
  <text class="s" x="190" y="300">reward rules · trigger rules · targeting</text>

  <text class="eyebrow" x="90" y="344">CHOOSE ONE PATH · EXTOLE READS THE TIER, IT DOES NOT COMPUTE IT</text>
</svg>
