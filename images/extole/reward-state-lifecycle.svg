<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" width="640" height="352" role="img" aria-labelledby="t d">
  <title id="t">The reward state lifecycle</title>
  <desc id="d">A reward moves from earned to fulfilled to redeemed. Separately, the expire, revoke and cancel operations move a reward into one of four terminal states: cancelled, failed, revoked or expired. Which operations are available depends on the reward's current state.</desc>
  <style>
    .n  { fill:none; stroke:#78716C; stroke-width:1.25; rx:5 }
    .na { fill:none; stroke:#EE0049; stroke-width:1.6; rx:5 }
    .t  { font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; fill:#78716C; text-anchor:middle }
    .ta { font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; fill:#EE0049; text-anchor:middle }
    .eyebrow { font:500 10px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; fill:#78716C; letter-spacing:.14em }
    .l  { font:500 11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; fill:#EE0049; letter-spacing:.03em }
    .ln { stroke:#78716C; stroke-width:1.25; fill:none }
    .dash { stroke:#EE0049; stroke-width:1.3; fill:none; stroke-dasharray:5 4 }
    .grp { fill:none; stroke:#78716C; stroke-width:1.1; stroke-dasharray:5 4; opacity:.7; rx:6 }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#78716C"/>
    </marker>
    <marker id="aa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#EE0049"/>
    </marker>
  </defs>

  <text class="eyebrow" x="40" y="28">DOCUMENTED PATH</text>

  <rect class="n" x="40" y="40" width="150" height="56"/>
  <text class="t" x="115" y="74">Earned</text>
  <line class="ln" x1="190" y1="68" x2="240" y2="68" marker-end="url(#a)"/>

  <rect class="n" x="245" y="40" width="150" height="56"/>
  <text class="t" x="320" y="74">Fulfilled</text>
  <line class="ln" x1="395" y1="68" x2="445" y2="68" marker-end="url(#a)"/>

  <rect class="na" x="450" y="40" width="150" height="56"/>
  <text class="ta" x="525" y="74">Redeemed</text>

  <line class="dash" x1="320" y1="96" x2="320" y2="186" marker-end="url(#aa)"/>
  <text class="l" x="332" y="146">expire · revoke · cancel</text>

  <rect class="grp" x="30" y="196" width="580" height="126"/>
  <text class="eyebrow" x="48" y="220">TERMINAL STATES</text>

  <rect class="n" x="48" y="238" width="125" height="52"/>
  <text class="t" x="110" y="270">Cancelled</text>

  <rect class="n" x="187" y="238" width="125" height="52"/>
  <text class="t" x="249" y="270">Failed</text>

  <rect class="n" x="326" y="238" width="125" height="52"/>
  <text class="t" x="388" y="270">Revoked</text>

  <rect class="n" x="465" y="238" width="125" height="52"/>
  <text class="t" x="527" y="270">Expired</text>
</svg>
