<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 660" width="580" height="660" role="img" aria-labelledby="t d">
  <title id="t">How a loyalty program moves a participant from action to reward</title>
  <desc id="d">Events from your systems reach Extole, pass quality and reward rules, issue a Collectible Reward in points, accumulate as a balance in the Reward Bank, and are redeemed for a Redemption Option that Extole then fulfills. Events that fail the rules issue no points.</desc>
  <style>
    .n  { fill:none; stroke:#78716C; stroke-width:1.25; rx:5 }
    .na { fill:none; stroke:#EE0049; stroke-width:1.6; rx:5 }
    .t  { font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; fill:#78716C }
    .ta { font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; fill:#EE0049 }
    .s  { font:400 11.5px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; fill:#78716C; opacity:.85 }
    .l  { font:500 11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; fill:#78716C; letter-spacing:.04em }
    .la { font:500 11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; fill:#EE0049; letter-spacing:.04em }
    .ln { stroke:#78716C; stroke-width:1.25; fill:none }
    .lna{ stroke:#EE0049; stroke-width:1.4; fill:none }
    .dash { stroke:#78716C; stroke-width:1.1; fill:none; stroke-dasharray:4 3; opacity:.75 }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#78716C"/>
    </marker>
    <marker id="aa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#EE0049"/>
    </marker>
  </defs>

  <!-- 1 your systems -->
  <rect class="n" x="60" y="26" width="290" height="62"/>
  <text class="t" x="80" y="52">Your systems</text>
  <text class="s" x="80" y="71">site · app · store · point of sale · CRM</text>

  <line class="ln" x1="205" y1="88" x2="205" y2="128" marker-end="url(#a)"/>
  <text class="l" x="215" y="112">events</text>

  <!-- 2 rules -->
  <rect class="n" x="60" y="130" width="290" height="62"/>
  <text class="t" x="80" y="156">Rules</text>
  <text class="s" x="80" y="175">quality rules, then reward rules</text>

  <!-- fail branch -->
  <line class="dash" x1="350" y1="161" x2="392" y2="161" marker-end="url(#a)"/>
  <rect class="n" x="396" y="139" width="158" height="44" stroke-dasharray="4 3" opacity=".75"/>
  <text class="s" x="412" y="166">no points issued</text>

  <line class="ln" x1="205" y1="192" x2="205" y2="232" marker-end="url(#a)"/>
  <text class="l" x="215" y="216">pass</text>

  <!-- 3 collectible reward -->
  <rect class="n" x="60" y="234" width="290" height="62"/>
  <text class="t" x="80" y="260">Collectible Reward</text>
  <text class="s" x="80" y="279">points issued to the participant</text>

  <line class="ln" x1="205" y1="296" x2="205" y2="336" marker-end="url(#a)"/>

  <!-- 4 reward bank (emphasis) -->
  <rect class="na" x="60" y="338" width="290" height="62"/>
  <text class="ta" x="80" y="364">Reward Bank</text>
  <text class="s" x="80" y="383">balance accumulates until they spend it</text>

  <line class="lna" x1="205" y1="400" x2="205" y2="440" marker-end="url(#aa)"/>
  <text class="la" x="215" y="424">member redeems</text>

  <!-- 5 redemption option -->
  <rect class="n" x="60" y="442" width="290" height="62"/>
  <text class="t" x="80" y="468">Redemption Option</text>
  <text class="s" x="80" y="487">gift card · coupon · account credit</text>

  <line class="ln" x1="205" y1="504" x2="205" y2="544" marker-end="url(#a)"/>
  <text class="l" x="215" y="528">at the Redemption Rate</text>

  <!-- 6 fulfillment -->
  <rect class="n" x="60" y="546" width="290" height="62"/>
  <text class="t" x="80" y="572">Fulfillment</text>
  <text class="s" x="80" y="591">recorded in Redemption History</text>
</svg>
